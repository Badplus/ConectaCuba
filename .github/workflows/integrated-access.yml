name: Integrated access and recovery
on:
  push:
    branches: [integracion-acceso-recuperacion, recuperacion-pin-admin-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ConectaCuba_v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_password_recovery test_integration_access
