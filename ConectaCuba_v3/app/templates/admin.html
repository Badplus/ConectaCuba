{% extends 'base.html' %}{% block content %}<div class="container"><div class="card"><h2>Panel del dueño</h2><form method="post" action="{{url_for('admin_commission')}}"><label>Comisión %</label><input style="max-width:180px" type="number" step="0.1" name="commission" value="{{setting.commission}}"><br><br><button class="btn primary">Actualizar</button></form></div><div class="card" style="overflow:auto"><table><tr><th>Nombre</th><th>Teléfono</th><th>Rol</th><th>Municipio</th><th>Verificado</th><th>Estado</th><th>Acción</th></tr>{% for u in users %}<tr><td>{{u.full_name}}</td><td>{{u.phone}}</td><td>{{u.role}}</td><td>{{u.municipality}}</td><td>{{'Sí' if u.phone_verified else 'No'}}</td><td>{{'ACTIVA' if u.approved else 'PENDIENTE'}}</td><td><form method="post" action="{{url_for('admin_toggle',user_id=u.id)}}"><button class="btn {{'danger' if u.approved else 'primary'}}">{{'Desactivar' if u.approved else 'Activar'}}</button></form></td></tr>{% endfor %}</table></div></div>{% endblock %}
