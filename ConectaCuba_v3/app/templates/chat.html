{% extends 'base.html' %}{% block content %}
<div class="container"><div class="form">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
<div><h2 style="margin-bottom:4px">Chat con {{other.full_name}}</h2><div class="muted">{{other.role|capitalize}} · {{other.municipality}}</div></div>
<a class="btn" href="{{url_for('chats')}}">← Mis chats</a></div>
<div style="margin-top:20px">{% for m in msgs %}
<div class="msg {{'mine' if m.sender_id==current_user.id else 'theirs'}}">{{m.body}}<div class="muted">{{m.created_at.strftime('%d/%m/%Y %H:%M')}}</div></div>
{% else %}<div class="muted">Aún no hay mensajes. Escribe el primero.</div>{% endfor %}</div>
<form method="post" style="margin-top:20px"><input name="body" placeholder="Escribe un mensaje" autocomplete="off" required><br><br><button class="btn primary">Enviar</button></form>
</div></div>{% endblock %}
