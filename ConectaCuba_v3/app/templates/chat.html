{% extends 'base.html' %}
{% block content %}
<div class="container">
  <div class="form">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div>
        <h2 style="margin-bottom:4px">Chat con {{other.full_name}}</h2>
        <div class="muted">{{other.role|capitalize}} · {{other.municipality}}</div>
      </div>
      <a class="btn" href="{{url_for('chats')}}">← Mis chats</a>
    </div>

    <div id="messages" style="margin-top:20px;max-height:60vh;overflow-y:auto;padding-right:4px">
      {% for m in msgs %}
        <div class="msg {{'mine' if m.sender_id==current_user.id else 'theirs'}}" data-message-id="{{m.id}}">
          <div class="message-body">{{m.body}}</div>
          <div class="muted">{{m.created_at.strftime('%d/%m/%Y %H:%M')}}</div>
        </div>
      {% else %}
        <div id="empty-chat" class="muted">Aún no hay mensajes. Escribe el primero.</div>
      {% endfor %}
    </div>

    <form id="chat-form" method="post" style="margin-top:20px">
      <input id="message-input" name="body" placeholder="Escribe un mensaje" autocomplete="off" required>
      <br><br>
      <button id="send-button" class="btn primary" type="submit">Enviar</button>
    </form>
  </div>
</div>

<script>
(() => {
  const messagesBox = document.getElementById('messages');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('message-input');
  const button = document.getElementById('send-button');
  const messagesUrl = "{{ url_for('chat_messages', user_id=other.id) }}";
  const sendUrl = "{{ url_for('chat', user_id=other.id) }}";

  let lastId = 0;
  let polling = false;

  function updateLastId() {
    document.querySelectorAll('[data-message-id]').forEach(el => {
      const id = Number(el.dataset.messageId || 0);
      if (id > lastId) lastId = id;
    });
  }

  function scrollToBottom() {
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  function addMessage(m) {
    if (document.querySelector(`[data-message-id="${m.id}"]`)) return;

    const empty = document.getElementById('empty-chat');
    if (empty) empty.remove();

    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (m.mine ? 'mine' : 'theirs');
    wrap.dataset.messageId = m.id;

    const body = document.createElement('div');
    body.className = 'message-body';
    body.textContent = m.body;

    const time = document.createElement('div');
    time.className = 'muted';
    time.textContent = m.created_at;

    wrap.appendChild(body);
    wrap.appendChild(time);
    messagesBox.appendChild(wrap);

    if (Number(m.id) > lastId) lastId = Number(m.id);
    scrollToBottom();
  }

  async function pollMessages() {
    if (polling || document.hidden) return;
    polling = true;
    try {
      const response = await fetch(`${messagesUrl}?after=${lastId}`, {
        headers: {'Accept': 'application/json'},
        cache: 'no-store'
      });
      if (response.ok) {
        const data = await response.json();
        (data.messages || []).forEach(addMessage);
      }
    } catch (e) {
      console.debug('Chat polling:', e);
    } finally {
      polling = false;
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const body = input.value.trim();
    if (!body) return;

    button.disabled = true;
    const formData = new FormData();
    formData.append('body', body);

    try {
      const response = await fetch(sendUrl, {
        method: 'POST',
        body: formData,
        headers: {'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json'}
      });

      if (!response.ok) throw new Error('No se pudo enviar el mensaje.');

      const data = await response.json();
      if (data.message) addMessage(data.message);
      input.value = '';
      input.focus();
    } catch (e) {
      alert('No se pudo enviar el mensaje. Inténtalo otra vez.');
    } finally {
      button.disabled = false;
    }
  });

  updateLastId();
  scrollToBottom();
  setInterval(pollMessages, 2000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) pollMessages();
  });
})();
</script>
{% endblock %}
