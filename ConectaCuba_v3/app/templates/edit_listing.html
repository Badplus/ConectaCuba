{% extends 'base.html' %}
{% block content %}
<div class="container"><div class="form"><h2>Editar publicación</h2>
<form method="post">
<input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>Producto</label><select name="product">{% for p in PRODUCTOS %}<option value="{{ p }}" {% if p==listing.product %}selected{% endif %}>{{ p }}</option>{% endfor %}</select>
<label>Nombre personalizado</label><input name="custom_product" maxlength="120" value="{{ listing.custom_product or '' }}">
<label>Cantidad</label><input name="quantity" type="number" min="0.001" step="0.001" value="{{ listing.quantity }}" required>
<label>Unidad</label><select name="unit">{% for u in ['lb','kg','unidad','saco','caja','L'] %}<option value="{{ u }}" {% if u==listing.unit %}selected{% endif %}>{{ u }}</option>{% endfor %}</select>
<label>Precio CUP</label><input name="price" type="number" min="0" step="0.01" value="{{ listing.price }}" required>
<label>Municipio</label><select name="municipality">{% for m in MUNICIPIOS %}<option value="{{ m }}" {% if m==listing.municipality %}selected{% endif %}>{{ m }}</option>{% endfor %}</select>
<label>Zona de venta</label><select name="coverage">{% for v in ['municipio','cercanos','provincia'] %}<option value="{{ v }}" {% if v==listing.coverage %}selected{% endif %}>{{ v }}</option>{% endfor %}</select>
<label>Descripción</label><textarea name="description" maxlength="2000">{{ listing.description or '' }}</textarea>
<button class="btn primary" type="submit">Guardar cambios</button>
</form></div></div>
{% endblock %}
