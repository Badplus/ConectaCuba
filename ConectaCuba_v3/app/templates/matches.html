{% extends 'base.html' %}{% block content %}<div class="container"><h2>Coincidencias para {{listing.display_product}}</h2><div class="list">{% for o,s,l in matches %}<div class="row"><div><b>{{o.display_product}}</b><div class="muted">{{o.quantity}} {{o.unit}} · {{o.price}} CUP · {{o.municipality}} · {{l}}</div></div><div><b>{{s}}/8</b> <a class="btn primary" href="{{url_for('chat',user_id=o.owner_id)}}">Chat</a></div></div>{% else %}<div class="card">Aún no hay coincidencias.</div>{% endfor %}</div></div>{% endblock %}
