{% extends 'base.html' %}{% block content %}<div class="container"><div class="form"><h2>Nueva publicación</h2><form method="post" class="grid"><div><label>Tipo</label><select name="kind"><option value="oferta">OFERTA</option><option value="demanda">DEMANDA</option></select></div><div><label>Producto</label><select name="product">{% for p in PRODUCTOS %}<option>{{p}}</option>{% endfor %}</select></div><div class="full"><label>Si es Otro</label><input name="custom_product"></div><div><label>Cantidad</label><input type="number" step="0.001" name="quantity" required></div><div><label>Unidad</label><select name="unit"><option>lb</option><option>kg</option><option>unidad</option><option>saco</option><option>caja</option><option>L</option></select></div><div><label>Precio CUP/unidad</label><input type="number" step="0.01" name="price" required></div><div><label>Municipio</label><select name="municipality">{% for m in MUNICIPIOS %}<option>{{m}}</option>{% endfor %}</select></div><div><label>Zona</label><select name="coverage"><option value="municipio">Solo municipio</option><option value="cercanos">Municipios cercanos</option><option value="provincia">Toda la provincia</option></select></div><div class="full"><label>Descripción</label><textarea name="description"></textarea></div><div class="full"><button class="btn primary">Publicar y buscar coincidencias</button></div></form></div></div>{% endblock %}
