{% extends 'base.html' %}{% block content %}
<div class="container"><div class="form"><h2>Crear cuenta</h2>
<p class="muted">Tu dirección exacta es privada. Solo mostramos provincia y municipio.</p>
<form method="post" class="grid">
<input type="hidden" name="_csrf" value="{{csrf_token()}}">
<div><label>Nombre completo</label><input name="full_name" maxlength="120" required></div>
<div><label>Teléfono / WhatsApp</label><input name="phone" maxlength="30" required></div>
<div><label>Contraseña</label><input type="password" name="password" minlength="8" required><div class="muted">Mínimo 8 caracteres.</div></div>
<div><label>Rol</label><select name="role"><option value="productor">Productor</option><option value="vendedor">Vendedor</option><option value="comprador">Comprador</option></select></div>
<div><label>Provincia</label><select id="province" name="province">{% for p in PROVINCIAS %}<option value="{{p}}">{{p}}</option>{% endfor %}</select></div>
<div><label>Municipio</label><select id="municipality" name="municipality"></select></div>
<div class="full"><label>Dirección exacta (privada)</label><input name="address" maxlength="255" required></div>
{% if turnstile_site_key %}<div class="full"><div class="cf-turnstile" data-sitekey="{{turnstile_site_key}}" data-language="es" data-appearance="interaction-only"></div></div>{% endif %}
<div class="full"><button class="btn primary">Registrarme</button></div>
</form></div></div>
<script>
const provinces={{PROVINCIAS|tojson}}, p=document.getElementById('province'), m=document.getElementById('municipality');
function fill(){m.innerHTML='';(provinces[p.value]||[]).forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;m.appendChild(o);});}
p.addEventListener('change',fill);fill();
</script>
{% if turnstile_site_key %}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{% endif %}
{% endblock %}
