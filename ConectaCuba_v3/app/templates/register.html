{% extends 'base.html' %}{% block content %}<div class="container"><div class="form"><h2>Crear cuenta</h2><p class="muted">Después de verificar el teléfono, tu cuenta quedará pendiente hasta que el dueño la active.</p><form method="post" class="grid"><div><label>Nombre</label><input name="full_name" required></div><div><label>Teléfono</label><input name="phone" required></div><div><label>Contraseña</label><input type="password" name="password" required></div><div><label>Rol</label><select name="role"><option value="productor">Productor</option><option value="vendedor">Vendedor</option><option value="comprador">Comprador</option></select></div><div><label>Municipio</label><select name="municipality">{% for m in MUNICIPIOS %}<option>{{m}}</option>{% endfor %}</select></div><div><label>Dirección privada</label><input name="address" required></div><div class="full"><button class="btn primary">Registrarme</button></div></form></div></div>{% endblock %}
