{% extends 'base.html' %}{% block content %}<div class="container"><div class="form"><h2>Establecer contraseña nueva</h2><p>Introduce dos veces tu nueva contraseña (mínimo 12 caracteres).</p><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Nueva contraseña</label><input type="password" name="new_password" minlength="12" maxlength="128" autocomplete="new-password" required><label>Repetir nueva contraseña</label><input type="password" name="confirm_password" minlength="12" maxlength="128" autocomplete="new-password" required><button class="btn primary" type="submit">Guardar nueva contraseña</button></form></div></div>{% endblock %}
