{% extends 'base.html' %}{% block content %}<div class="container"><div class="form"><h2>Introducir PIN de recuperación</h2><p>Introduce el teléfono registrado y el PIN de cinco cifras que te comunicó personalmente el administrador. El código caduca en 10 minutos.</p><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Teléfono registrado</label><input name="phone" type="tel" maxlength="30" autocomplete="tel" required><label>PIN de cinco cifras</label><input name="pin" inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5" autocomplete="one-time-code" required><button class="btn primary" type="submit">Verificar PIN</button></form><p><a href="{{ url_for('forgot_password') }}">Solicitar un PIN</a></p></div></div>{% endblock %}
